<!DOCTYPE html>
<html lang="PT-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos</title>
    <link rel="stylesheet" href="/docs/assets/css/style.css">
    <link rel="stylesheet" href="/docs/assets/css/cardapio.css">
</head>

<body>
    <header> <!-- versão administrativa do cardapio-->
        <div class="header-content">
            <h1 class="logo">Doce Deleite</h1>
            <input type="search" id="searchInput" class="pesquisa" placeholder="Buscar no cardápio...">
            <nav class="acoes">
                <a href="cardapioAdmin.html">Cardapio</a>
                <a href="sobreAdmin.html">Sobre</a>
                <a href="admin.html">Inicio</a>
            </nav>

        </div>
    </header>
    <main class="main-content admin-main">
        <button class="btn-add" id="btn-add" type="button">+ Adicionar produto</button>
        <div id="form-overlay" class="form-overlay hidden"></div>
        <form id="form-produto" class="form-produto hidden">
            <h3>Novo produto</h3>

            <input type="text" id="nome" placeholder="Nome do produto" required />
            <textarea id="descricao" placeholder="Descrição"></textarea>
            <input type="text" id="imagem" placeholder="URL da imagem" />
            <select id="categoria">
                <option value="ovos">Ovos</option>
                <option value="bolo De Pote">Bolos de pote</option>
                <option value="bolo Sob Encomenda">Bolos sob encomenda</option>
                <option value="sobremesas">Sobremesas</option>
                <option value="outros">+ Nova categoria</option>
            </select>

            <input type="text" id="novaCategoria" class="hidden" placeholder="Nova categoria">

            <input type="number" id="preco" placeholder="Preço" required />
            <button type="submit">Salvar</button>
            <button type="button" id="cancelar">Cancelar</button>
        </form>
        <div class="produtos_container"></div>
    </main>
    <script src="/docs/assets/js/admin/cardAdmin.js" defer></script>
<script src="/docs/assets/js/admin/admin.js" defer></script>
<footer>
        <p class="footer-frase">&copy; 2024 Doce Deleite. Todos os direitos reservados.</p>
</footer>
</body>
</html>
